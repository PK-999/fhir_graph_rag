# Dev overrides: mount source for hot-reload, skip builds for infra-only
services:
  postgres:
    ports:
      - "127.0.0.1:${FHIRGRAPH_POSTGRES_PORT:-55432}:5432"

  neo4j:
    ports:
      - "127.0.0.1:${FHIRGRAPH_NEO4J_HTTP_PORT:-57474}:7474"
      - "127.0.0.1:${FHIRGRAPH_NEO4J_BOLT_PORT:-57687}:7687"

  hapi-fhir:
    ports:
      - "127.0.0.1:${FHIRGRAPH_HAPI_PORT:-58080}:8080"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: dev
    volumes:
      - ../apps/api:/app/apps/api
      - ../libs:/app/libs
      - ../pipelines:/app/pipelines
    command: ["uvicorn", "apps.api.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      target: dev
    volumes:
      - ../apps/web/src:/app/apps/web/src
    environment:
      NEXT_PUBLIC_API_URL: ${FHIRGRAPH_PUBLIC_API_URL:-http://localhost:8010/api/v1}
