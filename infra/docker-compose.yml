services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    # No host ports by default — only reachable via the internal Compose network.
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fhirgraph}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?NEO4J_USER required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
    # No host ports by default — only reachable via the internal Compose network.
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  hapi-fhir:
    image: hapiproject/hapi@sha256:55213612779ab3eeec919226b7bad378f0061ade823393a61d7dd46dd5087a3d
    environment:
      hapi.fhir.fhir_version: R4
      # Keep exact evidence across restarts in a schema separate from audit data.
      spring.datasource.url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}?currentSchema=hapi
      spring.datasource.username: ${POSTGRES_USER:?POSTGRES_USER required}
      spring.datasource.password: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      spring.datasource.driver-class-name: org.postgresql.Driver
      HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      hapi.fhir.allow_multiple_delete: "true"
      hapi.fhir.reuse_cached_search_results_millis: "-1"
    # No host ports by default — only reachable via the internal Compose network.
    depends_on:
      postgres:
        condition: service_healthy
    # Distroless image: API readiness performs the bounded FHIR HTTP probe.

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "127.0.0.1:${FHIRGRAPH_API_PORT:-8010}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:?NEO4J_USER required}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD required}
      HAPI_FHIR_URL: http://hapi-fhir:8080/fhir
      LLM_BASE_URL: ${FHIRGRAPH_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_LOG_LEVEL: info
      READINESS_TIMEOUT_SECONDS: 2
      CORS_ORIGINS: http://localhost:${FHIRGRAPH_WEB_PORT:-4010},http://127.0.0.1:${FHIRGRAPH_WEB_PORT:-4010}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      hapi-fhir:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${FHIRGRAPH_PUBLIC_API_URL:-http://localhost:8010/api/v1}
    ports:
      - "127.0.0.1:${FHIRGRAPH_WEB_PORT:-4010}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${FHIRGRAPH_PUBLIC_API_URL:-http://localhost:8010/api/v1}
      API_INTERNAL_URL: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  pg_data:
  neo4j_data:
  neo4j_logs:
