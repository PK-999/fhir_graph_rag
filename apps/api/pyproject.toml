[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fhirgraph-api"
version = "1.0.0"
description = "FHIRGraph FastAPI backend"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "neo4j>=5.20",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "structlog>=24.1",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "openai>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
sources = {"app" = "apps/api/app"}
dev-mode-dirs = ["../.."]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
