[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fhir-graph-rag"
version = "0.1.0"
description = "Synthetic healthcare knowledge-graph platform built on FHIR R4"
requires-python = ">=3.12"
readme = "README.md"

dependencies = []

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["libs", "apps", "pipelines"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["libs", "apps", "pipelines"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "E501",    # line length handled by formatter
    "N815",    # FHIR spec requires camelCase field names
    "RUF001",  # en-dash in strings is intentional
    "RUF002",  # en-dash in docstrings is intentional
    "RUF003",  # en-dash in comments is intentional
    "TC001",  # type-checking blocks add complexity
    "TC002",  # type-checking blocks add complexity
    "TC003",  # type-checking blocks add complexity
    "B008",   # FastAPI Depends() usage
]

[tool.ruff.lint.isort]
known-first-party = ["libs"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "neo4j.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["libs", "apps"]
pythonpath = ["."]
addopts = "-v --tb=short"
asyncio_mode = "auto"
